spring.application.name=origenQuindio

# MongoDB: por defecto usa el contenedor de docker-compose.
# Para Atlas, definir ORIGEN_MONGODB_URI como variable de entorno (no subir la clave al repositorio).
spring.mongodb.uri=${ORIGEN_MONGODB_URI:mongodb://localhost:27027}
spring.mongodb.database=${ORIGEN_MONGODB_DATABASE:origen_quindio}
